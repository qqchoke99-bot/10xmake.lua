name: build
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          xmake f -p android -a arm64-v8a -m release --ndk="$ANDROID_NDK_ROOT" -y
          xmake -y
      - uses: actions/upload-artifact@v4
        with:
          name: SoundPhysics-levipack
          path: build/android/arm64-v8a/release/SoundPhysics.levipack
